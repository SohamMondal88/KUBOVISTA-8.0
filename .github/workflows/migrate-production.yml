name: Migrate production database
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIGRATE_PRODUCTION after taking a verified backup
        required: true
permissions:
  contents: read
concurrency:
  group: production-database-migration
  cancel-in-progress: false
jobs:
  migrate:
    if: inputs.confirmation == 'MIGRATE_PRODUCTION'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=dev
      - name: Apply checksum-verified migrations
        run: node scripts/migrate.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
